# Hala (هلا) – iPhone app, built on GitHub's free Mac.
# Put this file in your repository at:  .github/workflows/build-ipa.yml
# Every commit (or Actions → Build Hala IPA → Run workflow) builds an unsigned Hala.ipa
# under the run's "Artifacts". Install it with Sideloadly using your Apple ID.
name: Build Hala IPA
on:
  push:
  workflow_dispatch:

#
# App Store / TestFlight (after joining the Apple Developer Program):
#   Settings → Secrets and variables → Actions → New repository secret, add:
#     APPLE_TEAM_ID       – Team ID (developer.apple.com → Membership)
#     ASC_KEY_ID          – App Store Connect API key ID (Users and Access → Integrations, role: Admin)
#     ASC_ISSUER_ID       – Issuer ID shown on the same page
#     ASC_KEY_P8          – full text of the downloaded AuthKey_XXXX.p8 file
#   and create the app in App Store Connect with bundle ID sa.matl.rentals.
#   Every build then also signs Hala and uploads it to TestFlight automatically.

env:
  HALA_URL: https://hala-app-p16c.netlify.app/
  BUNDLE_ID: sa.matl.rentals
  VERSION: "1.31"

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Prepare
        run: |
          # build number must grow with every upload to Apple
          echo "BUILD=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"; echo "App Store signing: ON"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"; echo "App Store signing: OFF (secrets not set) – unsigned IPA only"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write the Xcode project
        run: |
          set -e
          mkdir -p ios/Hala/Assets.xcassets/AppIcon.appiconset
          cd ios

          cat > project.yml <<EOF
          name: Hala
          options:
            deploymentTarget:
              iOS: "15.0"
          targets:
            Hala:
              type: application
              platform: iOS
              sources: [Hala]
              scheme: {}
              info:
                path: Hala/Info.plist
                properties:
                  CFBundleDisplayName: هلا
                  CFBundleName: Hala
                  CFBundleShortVersionString: "$VERSION"
                  CFBundleVersion: "$BUILD"
                  CFBundleDevelopmentRegion: ar
                  LSRequiresIPhoneOS: true
                  UILaunchScreen:
                    UIImageRespectsSafeAreaInsets: false
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
                  UIRequiresFullScreen: true
                  UIViewControllerBasedStatusBarAppearance: true
                  ITSAppUsesNonExemptEncryption: false
                  NSCameraUsageDescription: "هلا تستخدم الكاميرا لتصوير رمز ربط الجوالات وصور الوحدات."
                  NSPhotoLibraryUsageDescription: "هلا تحتاج الصور لإضافة صورة الوحدة وصورة الباب."
                  NSPhotoLibraryAddUsageDescription: "هلا تحفظ الفواتير في الصور عند طلبك."
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID
                  MARKETING_VERSION: "$VERSION"
                  CURRENT_PROJECT_VERSION: "$BUILD"
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGN_STYLE: Automatic
                  DEVELOPMENT_TEAM: "$APPLE_TEAM_ID"
          EOF

          cat > Hala/AppDelegate.swift <<'EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          cat > Hala/ViewController.swift <<EOF
          import UIKit
          import WebKit

          let HOME = URL(string: "$HALA_URL")!
          let NAVY = UIColor(red: 31/255, green: 59/255, blue: 115/255, alpha: 1)

          final class ViewController: UIViewController, WKNavigationDelegate, WKUIDelegate, WKDownloadDelegate {
              private var web: WKWebView!
              private var downloadURL: URL?
              private let offline = UIView()

              override var preferredStatusBarStyle: UIStatusBarStyle { .lightContent }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = NAVY
                  let cfg = WKWebViewConfiguration()
                  cfg.allowsInlineMediaPlayback = true
                  cfg.mediaTypesRequiringUserActionForPlayback = []
                  cfg.websiteDataStore = .default()
                  web = WKWebView(frame: view.bounds, configuration: cfg)
                  web.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  web.scrollView.contentInsetAdjustmentBehavior = .never
                  web.isOpaque = false
                  web.backgroundColor = NAVY
                  web.navigationDelegate = self
                  web.uiDelegate = self
                  view.addSubview(web)
                  buildOffline()
                  load()
              }

              private func load() {
                  offline.isHidden = true
                  web.load(URLRequest(url: HOME, cachePolicy: .useProtocolCachePolicy, timeoutInterval: 25))
              }

              private func buildOffline() {
                  offline.frame = view.bounds
                  offline.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  offline.backgroundColor = NAVY
                  offline.isHidden = true
                  let label = UILabel()
                  label.text = "تعذّر فتح هلا\nتحقق من الإنترنت"
                  label.numberOfLines = 0
                  label.textAlignment = .center
                  label.textColor = .white
                  label.font = .systemFont(ofSize: 18, weight: .semibold)
                  let button = UIButton(type: .system)
                  button.setTitle("إعادة المحاولة", for: .normal)
                  button.setTitleColor(NAVY, for: .normal)
                  button.backgroundColor = .white
                  button.layer.cornerRadius = 14
                  button.titleLabel?.font = .systemFont(ofSize: 17, weight: .semibold)
                  button.addTarget(self, action: #selector(retry), for: .touchUpInside)
                  let stack = UIStackView(arrangedSubviews: [label, button])
                  stack.axis = .vertical
                  stack.spacing = 20
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  offline.addSubview(stack)
                  NSLayoutConstraint.activate([
                      stack.centerXAnchor.constraint(equalTo: offline.centerXAnchor),
                      stack.centerYAnchor.constraint(equalTo: offline.centerYAnchor),
                      button.widthAnchor.constraint(equalToConstant: 220),
                      button.heightAnchor.constraint(equalToConstant: 50),
                  ])
                  view.addSubview(offline)
              }

              @objc private func retry() { load() }

              private func isHala(_ u: URL) -> Bool {
                  if ["blob", "data", "about"].contains(u.scheme ?? "") { return true }
                  return u.host == HOME.host
              }

              // MARK: navigation – Hala stays inside, everything else (WhatsApp, platforms, maps) opens outside
              func webView(_ webView: WKWebView, decidePolicyFor action: WKNavigationAction,
                           decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  if action.shouldPerformDownload { decisionHandler(.download); return }
                  guard let u = action.request.url else { decisionHandler(.cancel); return }
                  if isHala(u) { decisionHandler(.allow); return }
                  UIApplication.shared.open(u)
                  decisionHandler(.cancel)
              }

              func webView(_ webView: WKWebView, decidePolicyFor response: WKNavigationResponse,
                           decisionHandler: @escaping (WKNavigationResponsePolicy) -> Void) {
                  decisionHandler(response.canShowMIMEType ? .allow : .download)
              }

              func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration,
                           for action: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                  if let u = action.request.url {
                      if u.host == HOME.host { webView.load(action.request) } else { UIApplication.shared.open(u) }
                  }
                  return nil
              }

              func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) {
                  if (error as NSError).code == NSURLErrorCancelled { return }
                  offline.isHidden = false
              }

              func webViewWebContentProcessDidTerminate(_ webView: WKWebView) { webView.reload() }

              // MARK: files (invoices, Excel, backups) → share sheet
              func webView(_ webView: WKWebView, navigationAction: WKNavigationAction, didBecome download: WKDownload) { download.delegate = self }
              func webView(_ webView: WKWebView, navigationResponse: WKNavigationResponse, didBecome download: WKDownload) { download.delegate = self }

              func download(_ download: WKDownload, decideDestinationUsing response: URLResponse,
                            suggestedFilename: String, completionHandler: @escaping (URL?) -> Void) {
                  let u = FileManager.default.temporaryDirectory.appendingPathComponent(suggestedFilename)
                  try? FileManager.default.removeItem(at: u)
                  downloadURL = u
                  completionHandler(u)
              }

              func downloadDidFinish(_ download: WKDownload) {
                  guard let u = downloadURL else { return }
                  let sheet = UIActivityViewController(activityItems: [u], applicationActivities: nil)
                  sheet.popoverPresentationController?.sourceView = view
                  present(sheet, animated: true)
              }

              // MARK: camera for scanning the link code (only for Hala's own page)
              func webView(_ webView: WKWebView, requestMediaCapturePermissionFor origin: WKSecurityOrigin,
                           initiatedByFrame frame: WKFrameInfo, type: WKMediaCaptureType,
                           decisionHandler: @escaping (WKPermissionDecision) -> Void) {
                  decisionHandler(origin.host == HOME.host ? .grant : .deny)
              }

              // MARK: alert / confirm used by the page
              func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String,
                           initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                  let a = UIAlertController(title: nil, message: message, preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "حسنًا", style: .default) { _ in completionHandler() })
                  present(a, animated: true)
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String,
                           initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  let a = UIAlertController(title: nil, message: message, preferredStyle: .alert)
                  a.addAction(UIAlertAction(title: "إلغاء", style: .cancel) { _ in completionHandler(false) })
                  a.addAction(UIAlertAction(title: "موافق", style: .default) { _ in completionHandler(true) })
                  present(a, animated: true)
              }
          }
          EOF

          # app icon: Hala's 512px icon from the site, enlarged to 1024 on a solid navy
          # background (the App Store rejects icons with transparency)
          curl -fsSL "${HALA_URL}icon-512.png" -o /tmp/icon.png
          python3 -m pip install -q --break-system-packages pillow 2>/dev/null || python3 -m pip install -q pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/icon.png').convert('RGBA').resize((1024, 1024), Image.LANCZOS)
          bg = Image.new('RGBA', src.size, (31, 59, 115, 255))
          bg.alpha_composite(src)
          bg.convert('RGB').save('Hala/Assets.xcassets/AppIcon.appiconset/AppIcon.png')
          PY
          cat > Hala/Assets.xcassets/Contents.json <<'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > Hala/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF

          xcodegen generate

      - name: Build unsigned IPA (Sideloadly)
        run: |
          set -eo pipefail
          cd ios
          xcodebuild -project Hala.xcodeproj -target Hala -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build | tail -25
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/Hala.app out/Payload/
          cd out && zip -qry "Hala-$VERSION-unsigned.ipa" Payload && ls -la

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hala-${{ env.VERSION }}-ipa
          path: ios/out/Hala-*-unsigned.ipa

      - name: Sign and upload to TestFlight
        if: env.SIGNED == 'true'
        run: |
          set -eo pipefail
          cd ios
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project Hala.xcodeproj -scheme Hala -configuration Release \
            -destination 'generic/platform=iOS' -archivePath out/Hala.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive | tail -30

          cat > out/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath out/Hala.xcarchive \
            -exportOptionsPlist out/ExportOptions.plist -exportPath out/appstore \
            "${AUTH[@]}" | tail -30
          echo "✅ Hala $VERSION ($BUILD) uploaded to App Store Connect – it appears in TestFlight after Apple processes it (5–30 min)."
          rm -f "$KEY"
